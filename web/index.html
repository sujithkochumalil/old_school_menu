<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Scan the QR and see our full menu.">
  <meta name="theme-color" content="#F6EFE6">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Menu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Menu</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F6EFE6; }
    #loader {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #F6EFE6; color: #3B2418;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    .steam { display: flex; gap: 8px; height: 24px; align-items: flex-end; margin-bottom: 6px; }
    .steam span { width: 4px; height: 16px; border-radius: 4px; background: #E0A044; animation: rise 1.2s ease-in-out infinite; }
    .steam span:nth-child(2) { animation-delay: .2s; }
    .steam span:nth-child(3) { animation-delay: .4s; }
    .cup { width: 44px; height: 32px; border: 4px solid #3B2418; border-top: 0; border-radius: 0 0 18px 18px; position: relative; margin-right: 12px; }
    .cup::after { content: ""; position: absolute; right: -15px; top: 3px; width: 9px; height: 13px; border: 4px solid #3B2418; border-left: 0; border-radius: 0 10px 10px 0; }
    #loader p { margin: 20px 0 0; font-size: 14px; letter-spacing: .3px; }
    @keyframes rise {
      0%, 100% { transform: translateY(4px); opacity: .25; }
      50% { transform: translateY(-4px); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="steam"><span></span><span></span><span></span></div>
    <div class="cup"></div>
    <p>Brewing your menu…</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
